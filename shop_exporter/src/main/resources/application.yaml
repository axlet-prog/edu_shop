spring:
  application:
    name: shop-exporter
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s

server:
  port: ${EXPORTER_PORT:9102}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: prometheus
      path-mapping:
        prometheus: metrics
  metrics:
    enable:
      http.server.requests: false

shop:
  exporter:
    api-url: ${SHOP_API_URL:http://localhost:8080}
