spring:
  application:
    name: shop-exporter
  http:
    clients:
      # Prometheus ждёт ответа exporter-а 10 с (scrape_timeout), поэтому API должно ответить быстрее
      connect-timeout: 2s
      read-timeout: 5s

server:
  port: ${EXPORTER_PORT:9102}

management:
  endpoints:
    web:
      # Prometheus забирает метрики с /metrics, а не со стандартного /actuator/prometheus
      base-path: /
      exposure:
        include: prometheus
      path-mapping:
        prometheus: metrics
  metrics:
    enable:
      # HTTP-запросы к exporter — это только опросы /metrics, их встроенная метрика Spring не нужна
      http.server.requests: false

shop:
  exporter:
    api-url: ${SHOP_API_URL:http://localhost:8080}
