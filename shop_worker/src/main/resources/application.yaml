spring:
  application:
    name: shop-worker
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shop}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:shop}
    password: ${RABBITMQ_PASSWORD:shop}
    listener:
      simple:
        # Берём из очереди по одному сообщению: необработанные заказы ждут в очереди (messages_ready),
        # а не скапливаются в буфере Worker-а (messages_unacked)
        prefetch: 1
        # Ошибку обработки (например, недоступна БД) повторяем, а потом отправляем сообщение в DLQ
        retry:
          enabled: true
          max-retries: 2

shop:
  worker:
    processing-delay: ${PROCESSING_DELAY_MS:2000}
