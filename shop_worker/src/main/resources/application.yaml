spring:
  application:
    name: shop-worker
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shop}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:shop}
    password: ${RABBITMQ_PASSWORD:shop}
    listener:
      simple:
        prefetch: 1
        retry:
          enabled: true
          max-retries: 2

server:
  port: ${METRICS_PORT:9101}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: prometheus
      path-mapping:
        prometheus: metrics
  metrics:
    enable:
      http.server.requests: false
      rabbitmq: false

shop:
  worker:
    processing-delay: ${PROCESSING_DELAY_MS:2000}
