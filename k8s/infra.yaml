# Инфраструктура API в namespace staging: PostgreSQL (схему создаёт Liquibase при старте API, без базы API
# не запустится), RabbitMQ (POST /orders) и Redis (GET /visits). Имена сервисов те же, что в k8s-manifests/staging.
# Данные хранятся в контейнере и пропадают при его пересоздании: для учебного кластера этого достаточно.
# Логины и пароли берутся из Secret, который в Git не хранится:
#   kubectl -n staging create secret generic edu-shop-credentials \
#     --from-literal=DB_USER=shop --from-literal=DB_PASSWORD=shop \
#     --from-literal=RABBITMQ_USER=shop --from-literal=RABBITMQ_PASSWORD=shop
#   kubectl apply -f k8s/infra.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: shop
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: edu-shop-credentials
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: edu-shop-credentials
                  key: DB_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d shop"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: staging
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          # Без плагина management: UI в этой работе не нужен, а образ легче, чем в docker-compose.yml
          image: rabbitmq:4-alpine
          ports:
            - containerPort: 5672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: edu-shop-credentials
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: edu-shop-credentials
                  key: RABBITMQ_PASSWORD
          # Проверка порта AMQP, а не `rabbitmq-diagnostics ping`: exec-проба идёт от root и при первом старте
          # успевает создать ~/.erlang.cookie раньше брокера, после чего брокер падает с eacces на этом файле
          readinessProbe:
            tcpSocket:
              port: 5672
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: staging
spec:
  selector:
    app: rabbitmq
  ports:
    - port: 5672
      targetPort: 5672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: staging
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
