spring:
  application:
    name: shop-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shop}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:shop}
    password: ${RABBITMQ_PASSWORD:shop}
  jackson:
    property-naming-strategy: SNAKE_CASE
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${API_PORT:8080}

management:
  endpoints:
    web:
      # Prometheus забирает метрики с /metrics, а не со стандартного /actuator/prometheus
      base-path: /
      exposure:
        include: prometheus
      path-mapping:
        prometheus: metrics
  metrics:
    enable:
      # Встроенную HTTP-метрику Spring заменяют http_requests_total и http_request_duration_seconds
      # из HttpMetricsFilter, поэтому её отключаем, чтобы не дублировать
      http.server.requests: false
      # Клиентские метрики RabbitMQ называются так же, как метрики самого брокера (rabbitmq_connections и др.)
      # и путались бы с ними. Метрики RabbitMQ отдаёт брокер через плагин rabbitmq_prometheus
      rabbitmq: false
