
input {
  beats {
    port => 5044
  }
}

filter {
  json {
    source => "message"
    target => "app"
    skip_on_invalid_json => true
  }

  if [app][route] in ["/health", "/metrics"] {
    drop {}
  }

  if [app][timestamp] {
    date {
      match => ["[app][timestamp]", "ISO8601"]
      target => "@timestamp"
    }
  }

  if [app][message] {
    mutate {
      replace => {
        "message" => "%{[app][message]}"
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    ilm_enabled => false
    index => "edu-shop-logs-%{+YYYY.MM.dd}"
  }
}
