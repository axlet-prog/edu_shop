filebeat.autodiscover:
  providers:
    - type: docker
      templates:
        - condition:
            or:
              - equals:
                  docker.container.labels.com.docker.compose.service: api
              - equals:
                  docker.container.labels.com.docker.compose.service: worker
          config:
            - type: filestream
              id: container-${data.docker.container.id}
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              parsers:
                - container: ~

output.logstash:
  hosts: ["logstash:5044"]