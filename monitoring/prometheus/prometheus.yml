global:
  scrape_interval: 15s
  evaluation_interval: 15s

remote_write:
  - url: http://victoriametrics:8428/api/v1/write

scrape_configs:
  - job_name: shop-api
    static_configs:
      - targets: ["api:8080"]

  - job_name: shop-worker
    static_configs:
      - targets: ["worker:9101"]

  - job_name: shop-exporter
    static_configs:
      - targets: ["exporter:9102"]

  # Готовые источники метрик инфраструктуры
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    track_timestamps_staleness: true
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: victoriametrics
    static_configs:
      - targets: ["victoriametrics:8428"]
