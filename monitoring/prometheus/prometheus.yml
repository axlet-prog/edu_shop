global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Всё, что собрал Prometheus, копируется в VictoriaMetrics: там метрики хранятся дольше
remote_write:
  - url: http://victoriametrics:8428/api/v1/write

# metrics_path по умолчанию /metrics, поэтому указан только там, где путь другой
scrape_configs:
  # Метрики, которые считает код API и Worker
  - job_name: shop-api
    static_configs:
      - targets: ["api:8080"]

  - job_name: shop-worker
    static_configs:
      - targets: ["worker:9101"]

  # Собственный exporter: переводит JSON из GET /internal/stats в метрики
  - job_name: shop-exporter
    static_configs:
      - targets: ["exporter:9102"]

  # Готовые источники метрик инфраструктуры
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    # cAdvisor отдаёт метрики с временными метками. Без этой настройки ряды удалённого контейнера
    # видны ещё 5 минут, и после пересоздания контейнера запрос по нему возвращает два ряда
    track_timestamps_staleness: true
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: rabbitmq
    # Плагин rabbitmq_prometheus на /metrics суммирует значения по всем очередям,
    # а на /metrics/per-object отдаёт их отдельно для каждой очереди с меткой queue
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Сам Prometheus и VictoriaMetrics: по их метрикам видно, что remote_write работает
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: victoriametrics
    static_configs:
      - targets: ["victoriametrics:8428"]
