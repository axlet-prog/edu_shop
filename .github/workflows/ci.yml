name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Новый push в PR отменяет устаревший запуск; запуски на main доводятся до конца
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Цепочка job-ов: ci → integration-tests → image → promote-to-staging → update-manifest.
# Каждый следующий job зависит от предыдущего через needs: если что-то упало, все последующие получают
# статус skipped, поэтому непроверенный образ не может попасть в staging.
jobs:
  ci:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # cache: gradle кэширует ~/.gradle/caches и ~/.gradle/wrapper. Ключ кэша строится по хэшу файлов
      # из cache-dependency-path, поэтому кэш обновляется только при изменении зависимостей.
      - name: Set up JDK 25 with Gradle cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
          cache-dependency-path: |
            **/gradle.lockfile
            **/*.gradle.kts
            **/gradle.properties
            **/gradle-wrapper.properties

      - name: Install dependencies (strictly by gradle.lockfile)
        run: ./gradlew resolveDependencies

      - name: Lint (Checkstyle)
        run: ./gradlew checkstyleMain checkstyleTest checkstyleIntegrationTest

      # Только unit-тесты из src/test: Docker им не нужен, интеграционные тесты сюда не попадают.
      # Quality Gate встроен в шаг: jacocoTestCoverageVerification завершается с ошибкой, если покрытие
      # строк или ветвлений ниже 80%. Код, за который отвечают интеграционные тесты, unit-порог не учитывает
      - name: Unit tests with coverage gate (JaCoCo, 80%)
        run: ./gradlew test jacocoTestCoverageVerification

      - name: Build (executable jars)
        run: ./gradlew assemble

      - name: Coverage summary
        if: always()
        run: bash .github/scripts/coverage-summary.sh test "Unit test coverage (JaCoCo, minimum 80%)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            */build/reports/tests/test/
            */build/reports/jacoco/test/
          retention-days: 14

  integration-tests:
    name: Integration tests (Testcontainers)
    # После unit-тестов: нет смысла поднимать контейнеры, если упали быстрые и дешёвые проверки
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Job-ы не делят файловую систему: каждый идёт на отдельном чистом раннере,
    # поэтому код и зависимости нужно получить заново
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25 with Gradle cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
          cache-dependency-path: |
            **/gradle.lockfile
            **/*.gradle.kts
            **/gradle.properties
            **/gradle-wrapper.properties

      - name: Install dependencies (strictly by gradle.lockfile)
        run: ./gradlew resolveDependencies

      # Docker на hosted-раннере уже есть, Testcontainers работает с ним без настроек.
      # Тестовые классы идут параллельно в потоках JUnit (настройка в shop_api/build.gradle.kts),
      # в логе Gradle это видно по строке «parallel execution of test classes = true»
      - name: Integration tests in parallel with coverage gate (JaCoCo, 80%)
        run: ./gradlew integrationTest jacocoIntegrationTestCoverageVerification

      # Подтверждение, что Testcontainers убрал за собой контейнеры, даже если тесты упали.
      # Остаться может только Ryuk: он сам удаляет себя через ~10 секунд после завершения тестовой JVM
      - name: Testcontainers cleanup check
        if: always()
        run: |
          docker ps -a --filter label=org.testcontainers=true --format 'table {{.Image}}\t{{.Names}}\t{{.Status}}'
          leftovers=$(docker ps -aq --filter label=org.testcontainers=true --filter ancestor=postgres:17-alpine \
            --filter ancestor=redis:7-alpine --filter ancestor=rabbitmq:4-alpine)
          if [ -n "$leftovers" ]; then
            echo "::error::Testcontainers left containers behind"
            exit 1
          fi
          echo "No PostgreSQL, Redis or RabbitMQ test containers left"

      - name: Coverage summary
        if: always()
        run: |
          bash .github/scripts/coverage-summary.sh integrationTest "Integration test coverage (JaCoCo, minimum 80%)" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload integration test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports
          path: |
            */build/reports/tests/integrationTest/
            */build/reports/jacoco/integrationTest/
          retention-days: 14

  image:
    name: Image (${{ matrix.service }})
    # Образ собирается только после интеграционных тестов: при их падении job получает статус skipped
    needs: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      # Отчёт Trivy и SBOM нужны по каждому образу, даже если другой образ не прошёл Quality Gate
      fail-fast: false
      matrix:
        include:
          - service: api
            module: shop_api
            port: 8080
          - service: worker
            module: shop_worker
            port: 9101
          - service: exporter
            module: shop_exporter
            port: 9102

    env:
      SERVICE: ${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Image name and short SHA
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${SERVICE}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push) with layer cache
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            MODULE=${{ matrix.module }}
            PORT=${{ matrix.port }}
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHORT_SHA }}
            ${{ env.IMAGE }}:build-${{ github.run_number }}
          # source связывает пакет в GHCR с репозиторием, revision — полный хэш коммита
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.75.0
          cache: true

      # Полный отчёт: все уровни критичности, без порога, поэтому шаг не падает.
      # Отчёт выгружается в артефакт, даже если следующие шаги упадут
      - name: Trivy full report
        run: trivy image --format table --output "trivy-report-${SERVICE}.txt" "${IMAGE}:${SHORT_SHA}"

      - name: Generate SBOM (CycloneDX)
        run: trivy image --format cyclonedx --output "sbom-${SERVICE}.cdx.json" "${IMAGE}:${SHORT_SHA}"

      - name: Trivy quality gate (HIGH, CRITICAL with fix)
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "${IMAGE}:${SHORT_SHA}"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report-${{ matrix.service }}
          path: trivy-report-${{ matrix.service }}.txt
          retention-days: 14

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cdx.json
          retention-days: 90

      # Публикуется только main: на Pull Request образ собирается и проверяется, но в реестр не попадает.
      # Без always() шаг выполняется только при успехе предыдущих, то есть после Quality Gate
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Публикуется тот самый образ, который проверил Trivy: он уже есть в Docker Engine (load: true),
      # пересобирать его не нужно. --all-tags отправляет оба тега, у них один и тот же digest
      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push --all-tags "$IMAGE"
          {
            echo "### Published image: ${SERVICE}"
            echo
            echo "- \`${IMAGE}:${SHORT_SHA}\`"
            echo "- \`${IMAGE}:build-${GITHUB_RUN_NUMBER}\`"
            echo "- digest: \`$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${SHORT_SHA}")\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Продвижение в staging по принципу Build Once, Deploy Many: образ, который прошёл тесты, Trivy и был
  # опубликован в job image, копируется в staging-пространство имён без пересборки
  promote-to-staging:
    name: Promote to staging (${{ matrix.service }})
    # needs: image — ждёт все три образа матрицы; если хоть один не опубликован, job пропускается.
    # Условие без always() неявно включает success(): упавший или пропущенный job выше = skipped здесь
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [api, worker, exporter]

    env:
      SERVICE: ${{ matrix.service }}

    steps:
      # Тег тот же, что в job image: короткий хэш коммита
      - name: Source and staging image names
        run: |
          TAG="${GITHUB_SHA::7}"
          echo "SOURCE=ghcr.io/${GITHUB_REPOSITORY,,}/${SERVICE}:${TAG}" >> "$GITHUB_ENV"
          echo "TARGET=ghcr.io/${GITHUB_REPOSITORY,,}-staging/${SERVICE}:${TAG}" >> "$GITHUB_ENV"

      # skopeo уже установлен на ubuntu-latest. Ему не нужен Docker Daemon: он работает с реестрами напрямую
      - name: Log in to GitHub Container Registry (skopeo)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          skopeo --version
          echo "$GHCR_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # Копируются манифест и слои как есть. --preserve-digests: если бы копия получила другой digest
      # (то есть другой образ), skopeo завершился бы с ошибкой
      - name: Copy image to staging without rebuild
        run: skopeo copy --all --preserve-digests "docker://${SOURCE}" "docker://${TARGET}"

      # Зелёный skopeo copy ещё не доказывает, что образ в staging тот самый: проверяем реестр напрямую
      - name: Verify staging image
        run: |
          skopeo inspect "docker://${TARGET}"
          source_digest=$(skopeo inspect --format '{{.Digest}}' "docker://${SOURCE}")
          target_digest=$(skopeo inspect --format '{{.Digest}}' "docker://${TARGET}")
          if [ "$source_digest" != "$target_digest" ]; then
            echo "::error::Staging image digest ${target_digest} differs from source ${source_digest}"
            exit 1
          fi
          {
            echo "### Promoted to staging: ${SERVICE}"
            echo
            echo "- from \`${SOURCE}\`"
            echo "- to \`${TARGET}\`"
            echo "- digest (same for both): \`${target_digest}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # GitOps: пайплайн не подключается к кластеру, а меняет желаемое состояние в Git.
  update-manifest:
    name: Update staging manifest (GitOps)
    needs: promote-to-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Без этого GITHUB_TOKEN только читает репозиторий, и git push завершится ошибкой 403
      contents: write

    env:
      MANIFEST: k8s-manifests/staging/deployment.yaml
      YQ_VERSION: v4.54.1
      YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f

    steps:
      # Манифест лежит в том же репозитории, отдельный git clone не нужен
      - name: Checkout
        uses: actions/checkout@v7

      # Фиксированная версия yq с проверкой контрольной суммы, а не «последняя»
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /usr/local/bin/yq" | sha256sum --check
          sudo chmod +x /usr/local/bin/yq
          yq --version

      # Меняется только тег, имя образа в каждом Deployment остаётся прежним
      - name: Update image tag in staging manifest
        run: |
          export TAG="${GITHUB_SHA::7}"
          yq -i '(select(.kind == "Deployment") | .spec.template.spec.containers[].image) |= sub(":[^:]+$", ":" + strenv(TAG))' \
            "$MANIFEST"
         
         images=$(yq -N 'select(.kind == "Deployment") | .spec.template.spec.containers[].image' "$MANIFEST")
          echo "$images"
          if echo "$images" | grep -v ":${TAG}\$"; then
            echo "::error::Not every image in ${MANIFEST} points to ${TAG}"
            exit 1
          fi

      - name: Commit and push
        run: |
          TAG="${GITHUB_SHA::7}"
          if git diff --quiet -- "$MANIFEST"; then
            echo "Manifest already points to ${TAG}, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST"
          git commit -m "Deploy ${TAG} to staging"
          git pull --rebase origin main
          git push origin HEAD:main
          {
            echo "### Staging manifest updated to \`${TAG}\`"
            echo
            echo '```diff'
            git show --format= -- "$MANIFEST"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
